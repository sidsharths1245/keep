            // ---------- Export / Conversion ----------
            // Recursive function to process lists and their nested items
            function processList(list, depth = 0) {
                let md = '';
                const indent = '    '.repeat(depth); // 4 spaces for standard markdown indentation
                const isOrdered = list.tagName === 'OL';
                let index = 1;

                for (let i = 0; i < list.children.length; i++) {
                    const child = list.children[i];
                    
                    if (child.tagName === 'LI') {
                        // Clone the li to extract text without nested lists
                        const clone = child.cloneNode(true);
                        // Remove nested lists from the clone
                        clone.querySelectorAll('ul, ol').forEach(el => el.remove());
                        
                        let text = clone.textContent.trim() || '';
                        // Normalize whitespace to single spaces
                        text = text.replace(/\s+/g, ' ');

                        const prefix = isOrdered ? `${index}. ` : '- ';
                        md += `${indent}${prefix}${text}\n`;
                        if (isOrdered) index++;

                        // Process nested lists inside this li
                        const nestedLists = Array.from(child.children).filter(c => c.tagName === 'UL' || c.tagName === 'OL');
                        nestedLists.forEach(nl => {
                            md += processList(nl, depth + 1);
                        });
                    } else if (child.tagName === 'UL' || child.tagName === 'OL') {
                        // Handle sibling nested lists (common in contenteditable)
                        md += processList(child, depth + 1);
                    }
                }
                return md;
            }

            function convertHtmlToMarkdown(html) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;

                // Remove horizontal rules
                tempDiv.querySelectorAll('hr').forEach(hr => hr.remove());

                // Handle images
                tempDiv.querySelectorAll('.img-resize-container').forEach(container => {
                    const img = container.querySelector('img');
                    if (img) {
                        const alt = img.getAttribute('alt') || '';
                        const src = img.getAttribute('src') || '';
                        container.replaceWith(`![${alt}](${src})`);
                    } else {
                        container.remove();
                    }
                });
                
                tempDiv.querySelectorAll('img').forEach(img => {
                    if (img.parentNode) {
                        const alt = img.getAttribute('alt') || '';
                        const src = img.getAttribute('src') || '';
                        img.replaceWith(`![${alt}](${src})`);
                    }
                });

                // Extract and convert lists using a placeholder approach to avoid serialization issues
                const listPlaceholders = [];
                const topLevelLists = Array.from(tempDiv.querySelectorAll('ul, ol')).filter(list => {
                    return !list.parentElement.closest('ul, ol');
                });

                topLevelLists.forEach((list, index) => {
                    const listMd = processList(list);
                    const placeholder = `___LIST_PLACEHOLDER_${index}___`;
                    
                    // Create a text node to hold the placeholder
                    const textNode = document.createTextNode(placeholder);
                    list.parentNode.replaceChild(textNode, list);
                    
                    listPlaceholders.push({ placeholder, listMd });
                });

                // Convert remaining HTML tags to Markdown
                tempDiv.querySelectorAll('a').forEach(a => a.replaceWith(`[${a.textContent}](${a.getAttribute('href') || '#'})`));
                tempDiv.querySelectorAll('b, strong').forEach(b => b.replaceWith(`**${b.textContent}**`));
                tempDiv.querySelectorAll('i, em').forEach(i => i.replaceWith(`*${i.textContent}*`));
                tempDiv.querySelectorAll('strike, s, del').forEach(s => s.replaceWith(`~~${s.textContent}~~`));
                tempDiv.querySelectorAll('code').forEach(c => c.replaceWith(`\`${c.textContent}\``));
                tempDiv.querySelectorAll('h1').forEach(h => h.replaceWith(`\n# ${h.textContent}\n`));
                tempDiv.querySelectorAll('h2').forEach(h => h.replaceWith(`\n## ${h.textContent}\n`));
                tempDiv.querySelectorAll('h3').forEach(h => h.replaceWith(`\n### ${h.textContent}\n`));
                tempDiv.querySelectorAll('blockquote').forEach(q => q.replaceWith(`\n> ${q.textContent}\n`));

                let markdown = tempDiv.innerHTML
                    .replace(/<li[^>]*>/g, '')
                    .replace(/<\/li>/g, '\n')
                    .replace(/<ul[^>]*>|<\/ul>|<ol[^>]*>|<\/ol>/g, '')
                    .replace(/<p[^>]*>/g, '')
                    .replace(/<\/p>/g, '\n\n')
                    .replace(/<div[^>]*>/g, '')
                    .replace(/<\/div>/g, '\n')
                    .replace(/<br\s*\/?>/g, '\n');

                const decoder = document.createElement('textarea');
                decoder.innerHTML = markdown;
                markdown = decoder.value;

                // Remove standalone horizontal rule lines
                markdown = markdown.replace(/^---+$/gm, '');
                markdown = markdown.replace(/^\*\*\*+$/gm, '');
                markdown = markdown.replace(/^___+$/gm, '');

                // Replace placeholders with actual list Markdown
                listPlaceholders.forEach(({ placeholder, listMd }) => {
                    markdown = markdown.replace(placeholder, `\n\n${listMd}\n`);
                });

                return markdown.replace(/\n{3,}/g, '\n\n').trim();
            }

            async function triggerBulkExport() {
                const idsToExport = selectedIds.size > 0 ? [...selectedIds] : (activeNoteId ? [activeNoteId] : []);
                if (idsToExport.length === 0) {
                    alert('No notes selected.');
                    return;
                }
                
                // Prompt for directory once per session, keep it in memory
                if (!exportDirHandle) {
                    try {
                        exportDirHandle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'notepad_manual_export' });
                    } catch (e) {
                        return; // User canceled the picker
                    }
                }

                let exportSuccess = false;

                for (const id of idsToExport) {
                    const targetNote = notes.find(n => n.id === id);
                    if (targetNote) {
                        try {
                            const safeTitle = (targetNote.title.trim() || 'Untitled').replace(/[\/\\?%*:|"<>]/g, '-');
                            const filename = `${safeTitle}.md`;
                            const mdContent = convertHtmlToMarkdown(targetNote.content);
                            let finalExportText = mdContent;
                            
                            if (targetNote.tags && targetNote.tags.length > 0) {
                                const yamlTags = targetNote.tags.map(tag => `  - ${tag}`).join('\n');
                                finalExportText = `---\ntags:\n${yamlTags}\n---\n\n` + mdContent;
                            }
                            
                            const fileHandle = await exportDirHandle.getFileHandle(filename, { create: true });
                            const writable = await fileHandle.createWritable();
                            await writable.write(finalExportText);
                            await writable.close();
                            
                            setExportedState(targetNote, true); // Persist export history independently of note data.
                            exportSuccess = true;
                        } catch (err) {
                            console.error(`Export failed for ${targetNote.title}`, err);
                        }
                    }
                }

                if (exportSuccess) {
                    saveToStorage(); // This triggers renderNotesList() to show the green badges
                    
                    const btn = document.getElementById('export-single-btn');
                    const originalColor = btn.style.color;
                    btn.style.color = 'var(--success)';
                    setTimeout(() => btn.style.color = originalColor, 1000);
                }
            }

            // ---------- Toolbar Active State ----------
            function updateToolbarState() {
                formatBtns.forEach(btn => {
                    const command = btn.getAttribute('data-command');
                    let isActive = false;
                    if (command === 'bold') isActive = document.queryCommandState('bold');
                    else if (command === 'italic') isActive = document.queryCommandState('italic');
                    else if (command === 'strikeThrough') isActive = document.queryCommandState('strikeThrough');
                    else if (command === 'insertUnorderedList') isActive = document.queryCommandState('insertUnorderedList');
                    else if (command === 'formatBlock') {
                        const value = btn.getAttribute('data-value') || '';
                        const currentFormat = document.queryCommandValue('formatBlock');
                        isActive = (currentFormat && currentFormat.toLowerCase() === value.toLowerCase());
                    }
                    if (isActive) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }

            // ---------- Multi‑selection logic ----------
            function selectOnly(id) {
                selectedIds.clear();
                selectedIds.add(id);
                lastClickedId = id;
            }

            function toggleSelection(id) {
                if (selectedIds.has(id)) {
                    selectedIds.delete(id);
                    if (lastClickedId === id) lastClickedId = null;
                } else {
                    selectedIds.add(id);
                    lastClickedId = id;
                }
            }

            function selectRange(fromId, toId) {
                const sorted = getSortedNotes();
                const idxFrom = sorted.findIndex(n => n.id === fromId);
                const idxTo = sorted.findIndex(n => n.id === toId);
                if (idxFrom === -1 || idxTo === -1) return;
                const [start, end] = idxFrom < idxTo ? [idxFrom, idxTo] : [idxTo, idxFrom];
                for (let i = start; i <= end; i++) {
                    selectedIds.add(sorted[i].id);
                }
            }

            function handleNoteClick(noteId, event) {
                if (event.ctrlKey || event.metaKey) {
                    toggleSelection(noteId);
                    event.preventDefault();
                } else if (event.shiftKey) {
                    if (lastClickedId) {
                        selectRange(lastClickedId, noteId);
                    } else {
                        selectOnly(noteId);
                    }
                    event.preventDefault();
                } else {
                    selectOnly(noteId);
                    activeNoteId = noteId;
                    loadActiveNote();
                }
                renderNotesList();
            }

            notesListEl.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (!li) return;
                const noteId = li.dataset.id;
                if (!noteId) return;
                handleNoteClick(noteId, e);
            });

            // ---------- Rubberband drag selection ----------
            let isDragging = false;
            let dragStartX, dragStartY;
            let initialSelectedIds = new Set();

            notesListEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                const li = e.target.closest('li');
                if (li) return;
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                initialSelectedIds = new Set(selectedIds);
                selectionOverlay.style.display = 'block';
                selectionOverlay.style.left = dragStartX + 'px';
                selectionOverlay.style.top = dragStartY + 'px';
                selectionOverlay.style.width = '0px';
                selectionOverlay.style.height = '0px';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const x1 = Math.min(dragStartX, e.clientX);
                const y1 = Math.min(dragStartY, e.clientY);
                const x2 = Math.max(dragStartX, e.clientX);
                const y2 = Math.max(dragStartY, e.clientY);
                selectionOverlay.style.left = x1 + 'px';
                selectionOverlay.style.top = y1 + 'px';
                selectionOverlay.style.width = (x2 - x1) + 'px';
                selectionOverlay.style.height = (y2 - y1) + 'px';

                selectedIds = new Set(initialSelectedIds);
                const notes = notesListEl.querySelectorAll('li');
                notes.forEach(li => {
                    const liRect = li.getBoundingClientRect();
                    if (liRect.left < x2 && liRect.right > x1 && liRect.top < y2 && liRect.bottom > y1) {
                        selectedIds.add(li.dataset.id);
                    }
                });
                renderNotesList();
            });

            document.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                selectionOverlay.style.display = 'none';
            });

            // ---------- Delete button ----------
            deleteNoteBtn.addEventListener('click', () => {
                const visibleIds = getSortedNotes()
                    .filter(n => currentFilter === 'trash' ? n.trashed === true : n.trashed !== true)
                    .map(n => n.id);
                const idsToDelete = [...selectedIds].filter(id => visibleIds.includes(id));
                const ids = idsToDelete.length > 0 ? idsToDelete : (activeNoteId ? [activeNoteId] : []);

                if (ids.length === 0) {
                    alert(currentFilter === 'trash' ? 'No notes in Trash selected.' : 'No notes selected.');
                    return;
                }

                if (currentFilter === 'trash') {
                    if (confirm(`Permanently delete ${ids.length} note(s)? This cannot be undone.`)) {
                        permanentlyDeleteNotes(ids);
                    }
                } else if (confirm(`Move ${ids.length} note(s) to Trash?`)) {
                    moveNotesToTrash(ids);
                }
            });

            noteTitleInput.addEventListener('input', updateActiveNote);

            exportSingleBtn.addEventListener('click', triggerBulkExport);

            // Formatting toolbar
            formatBtns.forEach(btn => {
                const cmd = btn.getAttribute('data-command');
                if (cmd === 'createLink' || cmd === 'insertImage') return;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const command = cmd;
                    let value = btn.getAttribute('data-value') || null;

                    if (command === 'formatBlock') {
                        const currentFormat = document.queryCommandValue('formatBlock');
                        if (currentFormat && currentFormat.toLowerCase() === value.toLowerCase()) {
                            value = 'DIV'; 
                        }
                    }

                    document.execCommand(command, false, value);
                    updateActiveNote();
                    noteContentEl.focus();
                    updateToolbarState();
                });
            });

            // ---------- Custom Link Popup ----------
            function saveCurrentSelection() {
                const sel = window.getSelection();
                if (sel.rangeCount > 0 && noteContentEl.contains(sel.anchorNode)) {
                    savedRange = sel.getRangeAt(0).cloneRange();
                } else {
                    savedRange = null;
                }
            }

            function restoreSelection() {
                if (savedRange) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRange);
                } else {
                    noteContentEl.focus();
                }
            }

            let editingLinkElement = null;

            function positionLinkPopup() {
                const linkBtn = document.querySelector('[data-command="createLink"]');
                const rect = linkBtn.getBoundingClientRect();
                linkPopup.style.top = (rect.bottom + 8) + 'px';
                linkPopup.style.left = (rect.left) + 'px';
            }

            function showLinkPopup(linkElement = null) {
                if (linkElement) {
                    editingLinkElement = linkElement;
                    saveCurrentSelection();
                    linkTextInput.value = linkElement.textContent || '';
                    linkUrlInput.value = linkElement.getAttribute('href') || '';
                    insertLinkBtn.textContent = 'Update';
                } else {
                    editingLinkElement = null;
                    saveCurrentSelection();
                    if (savedRange && !savedRange.collapsed) linkTextInput.value = savedRange.toString();
                    else linkTextInput.value = '';
                    linkUrlInput.value = '';
                    insertLinkBtn.textContent = 'Insert';
                }

                positionLinkPopup();
                linkPopup.classList.add('visible');
                setTimeout(() => linkTextInput.focus(), 50);
            }

            function hideLinkPopup() {
                linkPopup.classList.remove('visible');
                editingLinkElement = null;
                insertLinkBtn.textContent = 'Insert';
            }

            function insertLink() {
                const url = normalizeUrl(linkUrlInput.value.trim());
                const text = linkTextInput.value.trim();
                if (!url || !text || !isSafeUrl(url)) {
                    alert('Please enter valid link text and an http(s)/mailto URL.');
                    return;
                }

                if (editingLinkElement && noteContentEl.contains(editingLinkElement)) {
                    editingLinkElement.href = url;
                    editingLinkElement.textContent = text;
                    editingLinkElement.target = '_blank';
                    editingLinkElement.rel = 'noopener noreferrer';
                    updateActiveNote();
                    hideLinkPopup();
                    noteContentEl.focus();
                    return;
                }

                restoreSelection();
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const range = sel.getRangeAt(0);
                    range.deleteContents();
                    const link = document.createElement('a');
                    link.href = url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = text;
                    range.insertNode(link);
                    range.setStartAfter(link);
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);
                } else {
                    noteContentEl.focus();
                    document.execCommand('insertHTML', false, `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`);
                }
                updateActiveNote();
                hideLinkPopup();
                noteContentEl.focus();
            }

            document.querySelector('[data-command="createLink"]').addEventListener('click', (e) => {
                e.preventDefault();
                if (linkPopup.classList.contains('visible')) {
                    hideLinkPopup();
                } else {
                    showLinkPopup();
                }
            });

            noteContentEl.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link || !noteContentEl.contains(link)) return;

                // ONLY Ctrl/Cmd-click opens the URL. Every other click edits the link.
                e.preventDefault();
                e.stopPropagation();

                if (e.ctrlKey || e.metaKey) {
                    window.open(link.href, '_blank', 'noopener,noreferrer');
                    return;
                }

                const range = document.createRange();
                range.selectNodeContents(link);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                savedRange = range.cloneRange();
                showLinkPopup(link);
            });

            insertLinkBtn.addEventListener('click', insertLink);
            cancelLinkBtn.addEventListener('click', hideLinkPopup);

            document.addEventListener('click', (e) => {
                if (linkPopup.classList.contains('visible') && !e.target.closest('#link-popup') && !e.target.closest('[data-command="createLink"]')) {
                    hideLinkPopup();
                }
            });

            linkTextInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    linkUrlInput.focus();
                }
            });
            linkUrlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    insertLink();
                }
            });

            // ---------- Image Insertion & Resize ----------
            function showImagePopup() {
                saveCurrentSelection();
                imageUrlInput.value = '';
                imageAltInput.value = '';
                imageFileInput.value = '';
                imageFileName.textContent = '';
                const imgBtn = document.querySelector('[data-command="insertImage"]');
                const rect = imgBtn.getBoundingClientRect();
                imagePopup.style.top = (rect.bottom + 8) + 'px';
                imagePopup.style.left = (rect.left) + 'px';

            }

            function hideImagePopup() {
                imagePopup.classList.remove('visible');
            }

            function insertImage(src, alt) {
                const markup = buildResizableImageMarkup(src, alt || '');
                if (!markup) return;
                insertHtmlAtSelection(markup);
                hideImagePopup();
                noteContentEl.focus();
                setTimeout(enforceTypewriterScroll, 50);
            }

            function handleImageFromUrl() {
                const url = imageUrlInput.value.trim();
                const alt = imageAltInput.value.trim();
                if (!url) {
                    alert('Please enter an image URL.');
                    return;
                }
                insertImage(url, alt);
            }

            function handleImageFromFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    const alt = imageAltInput.value.trim() || file.name;
                    insertImage(dataUrl, alt);
                };
                reader.readAsDataURL(file);
            }

            imageFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    imageFileName.textContent = file.name;
                }
            });

            insertImageBtn.addEventListener('click', () => {
                if (imageFileInput.files && imageFileInput.files[0]) {
                    handleImageFromFile(imageFileInput.files[0]);
                } else {
                    handleImageFromUrl();
                }
            });

            cancelImageBtn.addEventListener('click', hideImagePopup);

            document.addEventListener('click', (e) => {
                if (imagePopup.classList.contains('visible') && !e.target.closest('#image-popup') && !e.target.closest('[data-command="insertImage"]')) {
                    hideImagePopup();
                }
            });

            imageUrlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleImageFromUrl();
                }
            });

            document.querySelector('[data-command="insertImage"]').addEventListener('click', (e) => {
                e.preventDefault();
                if (imagePopup.classList.contains('visible')) {
                    hideImagePopup();
                } else {
                    showImagePopup();
                }
            });

            // ---------- Image Resizing ----------
            let resizeState = null;
            let rafId = null;

            noteContentEl.addEventListener('mousedown', (e) => {
                const handle = e.target.closest('.resize-handle');
                if (!handle) return;
                e.preventDefault();
                e.stopPropagation();
                const container = handle.parentElement;
                const img = container.querySelector('img');
                if (!img) return;
                const rect = img.getBoundingClientRect();
                img.style.maxWidth = 'none';
                img.style.maxHeight = 'none';
                resizeState = {
                    img,
                    startX: e.clientX,
                    startY: e.clientY,
                    startWidth: rect.width,
                    startHeight: rect.height,
                    aspect: rect.width / rect.height,
                };
            });

            function onResizeMove(e) {
                if (!resizeState) return;
                const deltaX = e.clientX - resizeState.startX;
                const deltaY = e.clientY - resizeState.startY;
                let newWidth, newHeight;
                if (e.shiftKey) {
                    newWidth = resizeState.startWidth + deltaX;
                    newHeight = resizeState.startHeight + deltaY;
                } else {
                    const maxDelta = Math.max(Math.abs(deltaX), Math.abs(deltaY)) * (deltaX > 0 || deltaY > 0 ? 1 : -1);
                    newWidth = resizeState.startWidth + maxDelta;
                    newHeight = newWidth / resizeState.aspect;
                }
                newWidth = Math.max(20, newWidth);
                newHeight = Math.max(20, newHeight);
                resizeState.img.style.width = newWidth + 'px';
                resizeState.img.style.height = newHeight + 'px';
            }

            document.addEventListener('mousemove', (e) => {
                if (!resizeState) return;
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(() => {
                    onResizeMove(e);
                    rafId = null;
                });
            });

            document.addEventListener('mouseup', () => {
                if (resizeState) {
                    resizeState = null;
                    updateActiveNote(); 
                }
            });

            // ---------- Blockquote Helpers & Keyboard ----------
            function getBlockquoteAncestor() {
                const sel = window.getSelection();
                if (!sel.rangeCount) return null;
                let node = sel.anchorNode;
                while (node && node !== noteContentEl) {
                    if (node.nodeName === 'BLOCKQUOTE') return node;
                    node = node.parentNode;
                }
                return null;
            }

            function getCurrentBlockElement(container) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return null;
                let node = sel.anchorNode;
                while (node && node !== container) {
                    if (/^(P|DIV|H[1-6]|BLOCKQUOTE)$/.test(node.nodeName)) {
                        return node;
                    }
                    node = node.parentNode;
                }
                return null;
            }

            noteContentEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const blockquote = getBlockquoteAncestor();
                    if (blockquote) {
                        e.preventDefault();
                        if (lastKeyWasEnter) {
                            const sel = window.getSelection();
                            const currentBlock = getCurrentBlockElement(blockquote);
                            if (currentBlock && currentBlock !== blockquote && currentBlock.textContent.trim() === '') {
                                currentBlock.parentNode.removeChild(currentBlock);
                            }
                            const newPara = document.createElement('p');
                            newPara.innerHTML = '<br>';
                            blockquote.parentNode.insertBefore(newPara, blockquote.nextSibling);
                            const range = document.createRange();
                            range.setStart(newPara, 0);
                            range.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(range);
                            lastKeyWasEnter = false;
                            updateActiveNote();
                        } else {
                            const sel = window.getSelection();
                            if (sel.rangeCount) {
                                const range = sel.getRangeAt(0);
                                const newPara = document.createElement('p');
                                newPara.innerHTML = '<br>';
                                blockquote.appendChild(newPara);
                                range.setStart(newPara, 0);
                                range.collapse(true);
                                sel.removeAllRanges();
                                sel.addRange(range);
                            }
                            lastKeyWasEnter = true;
                        }
                        return;
                    }
                }

                if (e.key !== 'Enter') lastKeyWasEnter = false;

                if (e.key === 'Tab') {
                    e.preventDefault();
                    if (e.shiftKey) document.execCommand('outdent', false, null);
                    else document.execCommand('indent', false, null);
                }
            });

            noteContentEl.addEventListener('mousedown', () => {
                lastKeyWasEnter = false;
            });

            // ---------- Native Paste + Drag & Drop Images / Links ----------
            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function isSafeUrl(url, allowDataImage = false) {
                if (!url) return false;
                const trimmed = String(url).trim();
                if (/^(https?:|mailto:)/i.test(trimmed)) return true;
                return allowDataImage && /^data:image\//i.test(trimmed);
            }

            function normalizeUrl(url) {
                const value = String(url || '').trim();
                if (!value) return '';
                if (/^(https?:|mailto:)/i.test(value)) return value;
                return `https://${value}`;
            }

            function buildResizableImageMarkup(src, alt = '') {
                if (!isSafeUrl(src, true)) return '';
                // New/pasted images start at a readable size instead of their full native dimensions.
                // The image remains responsive and can still be resized with the handle.
                return `
                    <span class="img-resize-container" contenteditable="false" style="width:min(520px,100%);max-width:100%;">
                        <img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" style="width:100%;height:auto;">
                        <span class="resize-handle"></span>
                    </span>
                `;
            }

            function insertHtmlAtRange(html, range) {
                if (!html || !range) return;

                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                noteContentEl.focus();

                // Use the browser's editing command so inserted content participates in undo/redo.
                const inserted = document.execCommand('insertHTML', false, html);

                if (!inserted) {
                    const fallbackRange = range.cloneRange();
                    fallbackRange.deleteContents();
                    const template = document.createElement('template');
                    template.innerHTML = html;
                    const fragment = template.content;
                    const lastNode = fragment.lastChild;
                    fallbackRange.insertNode(fragment);
                    const caretRange = document.createRange();
                    if (lastNode) caretRange.setStartAfter(lastNode);
                    else caretRange.setStart(fallbackRange.endContainer, fallbackRange.endOffset);
                    caretRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(caretRange);
                }

                saveCurrentSelection();
                updateActiveNote();
                noteContentEl.focus();
            }

            function insertHtmlAtSelection(html) {
                if (!html) return;
                restoreSelection();
                const sel = window.getSelection();
                if (!sel.rangeCount || !noteContentEl.contains(sel.anchorNode)) return;
                insertHtmlAtRange(html, sel.getRangeAt(0).cloneRange());
            }

            function convertPlainTextToLinkedHtml(text) {
                const escaped = escapeHtml(text);
                const urlPattern = /((?:https?:\/\/|www\.)[^\s<]+)/gi;

                const linked = escaped.replace(urlPattern, (rawUrl) => {
                    const href = normalizeUrl(rawUrl);
                    const trailingMatch = rawUrl.match(/[.,!?;:)\]]+$/);
                    const trailing = trailingMatch ? trailingMatch[0] : '';
                    const visible = trailing ? rawUrl.slice(0, -trailing.length) : rawUrl;
                    const cleanHref = normalizeUrl(visible);

                    return `<a href="${escapeHtml(cleanHref)}" target="_blank" rel="noopener noreferrer">${escapeHtml(visible)}</a>${escapeHtml(trailing)}`;
                });

                return linked.replace(/\r?\n/g, '<br>');
            }

            function sanitizePastedHtml(html) {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = html;

                wrapper.querySelectorAll('script, style, meta, link, iframe, object, embed, form').forEach(el => el.remove());

                const allowedTags = new Set([
                    'A','B','STRONG','I','EM','S','STRIKE','DEL',
                    'H1','H2','H3','P','DIV','BR','BLOCKQUOTE',
                    'UL','OL','LI','CODE','PRE','SPAN','IMG'
                ]);

                wrapper.querySelectorAll('*').forEach(el => {
                    const tag = el.tagName.toUpperCase();

                    [...el.attributes].forEach(attr => {
                        const name = attr.name.toLowerCase();
                        const isGlobalAllowed = name === 'title';
                        const isLinkAllowed = tag === 'A' && name === 'href';
                        const isImageAllowed = tag === 'IMG' && ['src','alt'].includes(name);

                        if (name.startsWith('on') || !(isGlobalAllowed || isLinkAllowed || isImageAllowed)) {
                            el.removeAttribute(attr.name);
                        }
                    });

                    if (tag === 'A') {
                        const href = el.getAttribute('href') || '';
                        if (!isSafeUrl(href)) {
                            el.replaceWith(...el.childNodes);
                        } else {
                            el.setAttribute('target', '_blank');
                            el.setAttribute('rel', 'noopener noreferrer');
                        }
                    }

                    if (tag === 'IMG') {
                        const src = el.getAttribute('src') || '';
                        if (!isSafeUrl(src, true)) {
                            el.remove();
                        } else {
                            const replacement = document.createElement('template');
                            replacement.innerHTML = buildResizableImageMarkup(src, el.getAttribute('alt') || '');
                            el.replaceWith(replacement.content.cloneNode(true));
                        }
                    }

                    if (!allowedTags.has(tag) && el.parentNode) {
                        el.replaceWith(...el.childNodes);
                    }
                });

                return wrapper.innerHTML;
            }

            function pasteClipboardContent(e) {
                const clipboard = e.clipboardData || window.clipboardData;
                if (!clipboard) return;

                // Capture the caret/selection BEFORE preventDefault/focus changes.
                // This guarantees pasted links/text land exactly where the user pasted them.
                const sel = window.getSelection();
                const pasteRange = (sel.rangeCount && noteContentEl.contains(sel.anchorNode))
                    ? sel.getRangeAt(0).cloneRange()
                    : null;

                if (!pasteRange) return;
                savedRange = pasteRange.cloneRange();

                const imageItems = [...clipboard.items].filter(
                    item => item.kind === 'file' && item.type && item.type.startsWith('image/')
                );

                // Direct image/screenshot paste.
                if (imageItems.length > 0) {
                    e.preventDefault();

                    const files = imageItems.map(item => item.getAsFile()).filter(Boolean);
                    let insertionRange = pasteRange.cloneRange();

                    let chain = Promise.resolve();
                    files.forEach(file => {
                        chain = chain.then(() => new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = event => {
                                savedRange = insertionRange.cloneRange();
                                insertImage(event.target.result, file.name);
                                const currentSel = window.getSelection();
                                if (currentSel.rangeCount) insertionRange = currentSel.getRangeAt(0).cloneRange();
                                resolve();
                            };
                            reader.onerror = () => resolve();
                            reader.readAsDataURL(file);
                        }));
                    });

                    chain.finally(() => {
                        noteContentEl.focus();
                        setTimeout(enforceTypewriterScroll, 50);
                    });
                    return;
                }

                const html = clipboard.getData('text/html');
                const text = clipboard.getData('text/plain');

                if (html) {
                    const cleanHtml = sanitizePastedHtml(html);
                    if (cleanHtml.trim()) {
                        e.preventDefault();
                        insertHtmlAtRange(cleanHtml, pasteRange);
                        setTimeout(enforceTypewriterScroll, 50);
                        return;
                    }
                }

                if (text) {
                    e.preventDefault();
                    insertHtmlAtRange(convertPlainTextToLinkedHtml(text), pasteRange);
                    setTimeout(enforceTypewriterScroll, 50);
                }
            }

            noteContentEl.addEventListener('paste', pasteClipboardContent);

            let dragDepth = 0;

            function getRangeFromPoint(x, y) {
                if (document.caretRangeFromPoint) {
                    return document.caretRangeFromPoint(x, y);
                }

                if (document.caretPositionFromPoint) {
                    const pos = document.caretPositionFromPoint(x, y);
                    if (pos) {
                        const range = document.createRange();
                        range.setStart(pos.offsetNode, pos.offset);
                        range.collapse(true);
                        return range;
                    }
                }

                return null;
            }

            noteContentEl.addEventListener('dragenter', (e) => {
                e.preventDefault();
                dragDepth++;
                noteContentEl.classList.add('drop-active');
            });

            noteContentEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
                noteContentEl.classList.add('drop-active');
            });

            noteContentEl.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dragDepth = Math.max(0, dragDepth - 1);
                if (dragDepth === 0) noteContentEl.classList.remove('drop-active');
            });

            noteContentEl.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();

                dragDepth = 0;
                noteContentEl.classList.remove('drop-active');

                const dropRange = getRangeFromPoint(e.clientX, e.clientY);
                if (dropRange && noteContentEl.contains(dropRange.commonAncestorContainer)) {
                    savedRange = dropRange.cloneRange();
                }

                const files = [...(e.dataTransfer.files || [])];
                const imageFiles = files.filter(file => file.type && file.type.startsWith('image/'));

                if (imageFiles.length > 0) {
                    let chain = Promise.resolve();
                    imageFiles.forEach(file => {
                        chain = chain.then(() => new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = event => {
                                insertImage(event.target.result, file.name);
                                resolve();
                            };
                            reader.onerror = () => resolve();
                            reader.readAsDataURL(file);
                        }));
                    });
                    return;
                }

                const uriList = (e.dataTransfer.getData('text/uri-list') || '')
                    .split(/\r?\n/)
                    .find(url => /^https?:\/\//i.test(url.trim()));

                const html = e.dataTransfer.getData('text/html');
                const text = e.dataTransfer.getData('text/plain') || '';

                if (uriList) {
                    const label = text.trim() && text.trim() !== uriList.trim() ? text.trim() : uriList.trim();
                    const linkHtml = `<a href="${escapeHtml(uriList.trim())}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
                    insertHtmlAtSelection(linkHtml);
                    return;
                }

                if (html) {
                    const cleanHtml = sanitizePastedHtml(html);
                    if (cleanHtml.trim()) {
                        insertHtmlAtSelection(cleanHtml);
                        return;
                    }
                }

                if (text.trim()) {
                    insertHtmlAtSelection(convertPlainTextToLinkedHtml(text));
                }
            });


            await init();
            storageReady = true;
            if (auth.currentUser) listenToCloud();
            updateToolbarState();
        });
    </script>
</body>
</html>
