<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        :root {
            /* Ultra-Dark Aesthetic Palette */
            --bg-body: #050505;
            --bg-sidebar: #0a0a0a;
            --bg-card: #121212;
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-highlight: rgba(255, 255, 255, 0.12);
            
            --text-primary: #ededed;
            --text-secondary: #858585;
            
            --item-hover: #161616;
            --item-active: #1c1c1c;
            
            /* Vibrant Blue Accent from Screenshot */
            --accent: #1877f2; 
            --accent-hover: #388cf5;
            --accent-bg: rgba(24, 119, 242, 0.12);
            --accent-glow: 0 0 16px rgba(24, 119, 242, 0.3);
            
            --code-bg: #1a1a1a;
            --danger: #ff453a;
            --danger-bg: rgba(255, 69, 58, 0.12);
            --danger-hover: rgba(255, 69, 58, 0.25);
            
            /* Success Green */
            --success: #2ecc71;
            --success-bg: rgba(46, 204, 113, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        ::selection {
            background-color: rgba(24, 119, 242, 0.3);
            color: #ffffff;
        }

        body {
            font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% 30%, #111116 0%, var(--bg-body) 70%);
        }

        .app-container { 
            display: flex; 
            height: 100%; 
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background-color: #2a2a2a; 
            border: 3px solid var(--bg-body); 
            border-radius: 8px; 
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #444; }

        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .sidebar.collapsed { margin-left: -280px; }

        .sidebar-header { 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .sidebar-header h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar-header-actions { display: flex; gap: 6px; align-items: center; }

        /* Custom Filter Dropdown */
        .filter-dropdown {
            position: absolute;
            top: 100%; right: 0; margin-top: 8px; width: 140px;
            background: var(--bg-card);
            border: 1px solid var(--border-highlight);
            border-radius: 8px; padding: 6px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            display: none; flex-direction: column; gap: 2px;
            z-index: 200;
        }
        .filter-dropdown.visible { display: flex; animation: flyIn 0.15s ease-out; }
        .filter-option {
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-primary); transition: background 0.1s;
        }
        .filter-option:hover { background-color: var(--item-hover); }
        .filter-option.active { color: var(--accent); font-weight: 500; background-color: var(--accent-bg); }

        .sidebar-folder-btn {
            width: 100%;
            margin: 0;
            padding: 12px 20px;
            border: none;
            border-top: 1px solid var(--border-color); /* Requested border */
            border-radius: 0;
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font: inherit;
            transition: all 0.15s ease;
            flex-shrink: 0;
            justify-content: center; /* Always centered */
            text-align: center;
        }
        .sidebar-folder-btn:hover {
            background: var(--item-hover);
            color: var(--text-primary);
        }
        .sidebar-folder-btn.active {
            background: var(--accent-bg);
            color: var(--accent);
        }
        /* Removed .has-count overrides for alignment */
        .sidebar-folder-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sidebar-folder-icon svg { width: 17px; height: 17px; }
        .sidebar-folder-label {
            font-size: 13px;
            font-weight: 500;
        }
        .sidebar-folder-count {
            min-width: 18px;
            text-align: right;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .notes-list {
            list-style: none; overflow-y: auto; flex: 1; padding: 0 12px 12px 12px;
            position: relative;
        }
        .notes-list li {
            padding: 10px 14px; margin-bottom: 4px; cursor: pointer; border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.15s ease;
            display: flex; gap: 10px;
            user-select: none;
            background-color: transparent;
        }
        .notes-list li:hover { 
            background-color: var(--item-hover); 
        }
        .notes-list li.active { 
            background-color: var(--item-active); 
        }
        .notes-list li.selected {
            background-color: var(--accent-bg);
            border-color: rgba(24, 119, 242, 0.3);
        }
        .notes-list li.active.selected {
            background-color: var(--accent-bg);
            border-color: var(--accent);
        }
        .notes-list li.trashed-note .note-item-title-text {
            text-decoration: line-through;
            opacity: 0.75;
        }

        .note-item-info { flex: 1; min-width: 0; }
        .note-item-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; color: var(--text-primary); }
        .note-item-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .note-item-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .note-item-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .tag-badge { 
            font-size: 10px; 
            background-color: #1a1a1a; 
            color: var(--text-secondary); 
            padding: 3px 8px; 
            border-radius: 4px; 
            border: 1px solid var(--border-color);
        }
        /* Intentionally removed active override for tag-badge so it keeps its neutral color */

        .exported-icon {
            width: 16px; height: 16px; color: var(--success); flex-shrink: 0; margin-left: 6px;
        }

        /* Sticky Action Menu */
        .sidebar-bottom-actions {
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            background-color: var(--bg-sidebar);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .auth-footer { 
            padding: 16px; 
            background-color: var(--bg-sidebar); 
            border-top: 1px solid var(--border-color); 
            display: flex; align-items: center; gap: 8px;
            flex-shrink: 0;
        }
        .auth-btn { 
            flex: 1; padding: 10px; background: transparent; 
            border: 1px solid var(--border-color); color: var(--text-primary); 
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; 
            transition: all 0.2s ease; 
        }
        .auth-btn:hover { 
            background: #1a1a1a; 
            border-color: var(--border-highlight); 
        }
        
        #logout-btn { 
            width: 36px; height: 36px; flex-shrink: 0; 
            background: var(--danger-bg); 
            border: 1px solid rgba(255, 69, 58, 0.4); 
            color: var(--danger);
            border-radius: 6px; cursor: pointer; display: none; 
            align-items: center; justify-content: center; 
            transition: all 0.2s ease;
        }
        #logout-btn:hover { 
            background: var(--danger-hover); 
            border-color: var(--danger); 
        }

        .editor-container { 
            flex: 1; display: flex; flex-direction: column; min-width: 0; 
            background-color: transparent; 
        }
        
        .editor-header { 
            padding: 12px 24px; 
            background-color: transparent; 
            display: flex; align-items: center; gap: 16px; height: 64px; 
        }
        
        #note-title { 
            flex: 1; font-size: 18px; font-weight: 500; border: none; outline: none; 
            background: transparent; color: var(--text-primary); font-family: inherit; 
            padding: 4px 0;
        }
        #note-title::placeholder { color: var(--text-secondary); }

        #delete-note-btn {
            color: var(--danger);
            border: 1px solid transparent;
        }
        #delete-note-btn:hover {
            background-color: var(--danger-bg);
            border-color: rgba(255, 69, 58, 0.3);
            color: #ff5e54;
        }

        .editor-body { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            overflow-y: auto; 
            padding: 0 32px 0 32px; 
        }

        .editor-center-card {
            position: relative; 
            width: 100%;
            max-width: 840px; 
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            min-height: 85vh; 
            margin-top: 20px;
            margin-bottom: 60px; 
        }

        .card-resizer {
            position: absolute;
            top: 0; 
            bottom: 0;
            width: 12px;
            cursor: ew-resize;
            z-index: 10;
            background-color: transparent;
            transition: background-color 0.2s ease;
            border-radius: 4px;
        }
        .card-resizer:hover, .card-resizer.active {
            background-color: rgba(24, 119, 242, 0.3);
        }
        .card-resizer.left-edge { left: -6px; }
        .card-resizer.right-edge { right: -6px; }

        .format-toolbar {
            display: flex; gap: 6px; padding: 12px 24px; border-bottom: 1px solid var(--border-color);
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top-left-radius: 11px; 
            border-top-right-radius: 11px;
        }
        
        .icon-btn { 
            background: transparent; border: 1px solid transparent; cursor: pointer; 
            color: var(--text-secondary); display: flex; align-items: center; justify-content: center; 
            width: 32px; height: 32px; border-radius: 6px; 
            transition: all 0.15s ease; 
        }
        .icon-btn:not(#delete-note-btn):hover { 
            background-color: rgba(255, 255, 255, 0.08); 
            color: var(--text-primary);
        }
        .icon-btn.active { 
            color: var(--accent); 
            background-color: var(--accent-bg); 
            border: 1px solid var(--accent);
        }
        .icon-btn svg { width: 16px; height: 16px; stroke-width: 1.7; }

        .tag-dropdown-container { position: relative; display: inline-block; margin-left: auto; }
        
        .tag-dropdown, .link-popup, .image-popup {
            position: absolute; 
            background: #141414;
            border: 1px solid var(--border-highlight); 
            border-radius: 8px; padding: 16px; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.6); 
            display: none; flex-direction: column; gap: 12px;
            z-index: 200;
        }
        
        .tag-dropdown { top: 100%; right: 0; margin-top: 8px; width: 280px; }
        .tag-dropdown.visible { display: flex; animation: flyIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes flyIn {
            from { opacity: 0; transform: translateY(-4px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tag-input-row { display: flex; gap: 8px; }
        
        input[type="text"] { 
            flex: 1; 
            background: #0a0a0a; 
            border: 1px solid var(--border-color); 
            color: var(--text-primary); 
            padding: 8px 12px; 
            border-radius: 6px; outline: none; font-size: 13px; 
            transition: all 0.2s ease;
        }
        input[type="text"]:focus { 
            border-color: var(--accent); 
        }
        
        .tag-input-row button, #insert-link-btn, #insert-image-btn { 
            background: var(--accent); 
            color: #ffffff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 500; 
            transition: all 0.2s;
            box-shadow: var(--accent-glow);
        }
        .tag-input-row button { width: 32px; font-weight: bold; }
        .tag-input-row button:hover, #insert-link-btn:hover, #insert-image-btn:hover { 
            background: var(--accent-hover); 
        }
        
        .tag-list-ui { list-style: none; max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
        .tag-list-ui li {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 10px;
            border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-primary);
            transition: background 0.1s;
        }
        .tag-list-ui li:hover { background-color: var(--item-hover); }
        .tag-list-ui li.applied { color: var(--accent); font-weight: 500; background-color: var(--accent-bg); }
        .tag-list-ui .delete-tag-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.2s; }
        .tag-list-ui li:hover .delete-tag-btn { opacity: 1; }
        .tag-list-ui .delete-tag-btn:hover { color: var(--danger); background: var(--danger-bg); }

        #note-content { 
            flex: 1; 
            padding: 32px 48px 500px 48px; 
            font-size: 15px; line-height: 1.7; 
            outline: none; color: var(--text-primary); 
        }
        #note-content:empty:before { content: attr(data-placeholder); color: var(--text-secondary); pointer-events: none; display: block; }
        #note-content h1, #note-content h2, #note-content h3 { margin-top: 28px; margin-bottom: 14px; font-weight: 600; letter-spacing: -0.02em; }
        #note-content h1:first-child, #note-content h2:first-child { margin-top: 0; }
        #note-content h1 { font-size: 26px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        #note-content h2 { font-size: 20px; }
        #note-content p { margin-bottom: 14px; }
        #note-content a { color: var(--accent); text-decoration: none; cursor: pointer; transition: color 0.2s; }
        #note-content a:hover { text-decoration: underline; color: var(--accent-hover); }
        #note-content ul, #note-content ol { margin-bottom: 18px; padding-left: 28px; }
        #note-content li { margin-bottom: 6px; }
        #note-content blockquote { 
            border-left: 3px solid var(--accent); 
            padding-left: 18px; color: var(--text-secondary); 
            margin-bottom: 18px; background-color: #161616; 
            padding-top: 10px; padding-bottom: 10px; border-radius: 0 6px 6px 0; 
        }
        #note-content code { 
            background-color: var(--code-bg); padding: 3px 6px; 
            border-radius: 4px; font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace; 
            font-size: 13.5px; border: 1px solid var(--border-color); 
        }

        /* Native paste / drag-and-drop feedback */
        #note-content.drop-active {
            outline: 2px dashed var(--accent);
            outline-offset: -8px;
            background: rgba(24, 119, 242, 0.04);
        }

        .img-resize-container {
            position: relative;
            display: inline-block;
            user-select: none;
            vertical-align: middle;
            overflow: hidden;
            border-radius: 6px;
        }
        .img-resize-container {
            max-width: 100%;
        }
        .img-resize-container img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .img-resize-container .resize-handle {
            position: absolute;
            width: 14px;
            height: 14px;
            bottom: 6px;
            right: 6px;
            background: var(--accent);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: nwse-resize;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .img-resize-container:hover .resize-handle {
            opacity: 1;
        }

        .link-popup, .image-popup { width: 300px; }
        .link-popup.visible, .image-popup.visible { display: flex; animation: flyIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .link-popup-actions, .image-popup-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
        .link-popup-actions button, .image-popup-actions button {
            padding: 8px 16px;
            font-size: 13px;
        }
        .link-popup-actions button.cancel, .image-popup-actions button.cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            box-shadow: none;
        }
        .link-popup-actions button.cancel:hover, .image-popup-actions button.cancel:hover {
            background: var(--item-hover);
            border-color: var(--border-highlight);
        }
        
        .image-upload-row { display: flex; align-items: center; gap: 10px; }
        .image-upload-row input[type="file"] { display: none; }
        .image-upload-row label {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .image-upload-row label:hover { background: #222; border-color: var(--border-highlight); }

        #selection-overlay {
            position: absolute;
            border: 1px solid rgba(24, 119, 242, 0.5);
            background-color: rgba(24, 119, 242, 0.15);
            pointer-events: none;
            z-index: 50;
            display: none;
            border-radius: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; animation: fadeIn 0.2s; }
        
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            width: 420px;
            max-width: 90vw;
            padding: 24px;
            box-shadow: 0 24px 50px rgba(0,0,0,0.5);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); margin: 0; }
        .shortcut-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border-color);
        }
        .shortcut-row:last-child { border-bottom: none; }
        .shortcut-name { font-size: 14px; color: var(--text-secondary); }
        .shortcut-btn {
            background: #1a1a1a; border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 8px 12px; border-radius: 6px;
            font-family: ui-monospace, monospace; font-size: 12px; cursor: pointer;
            transition: all 0.2s; min-width: 120px; text-align: center;
        }
        .shortcut-btn:hover { background: #222; border-color: var(--accent); }
        .shortcut-btn.recording { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); box-shadow: var(--accent-glow); }
        .modal-actions { margin-top: 24px; text-align: right; }
        .modal-actions button.cancel {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-size: 13px; transition: all 0.2s;
        }
        .modal-actions button.cancel:hover { background: var(--item-hover); color: var(--text-primary); }

        /* Context Menu Styles */
        .context-menu {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border-highlight);
            border-radius: 8px;
            padding: 6px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 9999;
            min-width: 160px;
        }
        .context-menu.visible {
            display: flex;
            animation: fadeIn 0.15s ease-out;
        }
        .context-menu .menu-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            transition: background 0.2s;
            user-select: none;
        }
        .context-menu .menu-item:hover {
            background: var(--item-hover);
        }
        .context-menu .menu-item.danger {
            color: var(--danger);
        }
        .context-menu .menu-item.danger:hover {
            background: var(--danger-bg);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Notes</h2>
                <div class="sidebar-header-actions">
                    <!-- Funnel Filter Button -->
                    <div class="filter-dropdown-container" style="position: relative; display: flex;">
                        <button id="filter-menu-btn" class="icon-btn" title="Filter Notes">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                            </svg>
                        </button>
                        <div id="filter-dropdown" class="filter-dropdown">
                            <div class="filter-option active" data-filter="all">All Notes</div>
                            <div class="filter-option" data-filter="exported">Exported</div>
                            <div class="filter-option" data-filter="pending">Not Exported</div>
                        </div>
                    </div>
                    
                    <button id="add-note-btn" class="icon-btn" title="New Note">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <ul id="notes-list" class="notes-list"></ul>
            <div id="selection-overlay"></div>

            <button id="trash-folder-btn" class="sidebar-folder-btn" type="button" title="Open Trash">
                <span class="sidebar-folder-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"></path>

        document.addEventListener('DOMContentLoaded', async () => {

            // Shortcuts elements

            // Link & Image popup elements

            const insertLinkBtn = document.getElementById('insert-link-btn');

            const imagePopup = document.getElementById('image-popup');
            const imageUrlInput = document.getElementById('image-url-input');
            const imageAltInput = document.getElementById('image-alt-input');
            const imageFileInput = document.getElementById('image-file-input');
            const imageFileName = document.getElementById('image-file-name');
            const insertImageBtn = document.getElementById('insert-image-btn');
            const cancelImageBtn = document.getElementById('cancel-image-btn');

            const selectionOverlay = document.getElementById('selection-overlay');
            const editorCard = document.getElementById('editor-card');
            const cardResizers = document.querySelectorAll('.card-resizer');

            // State
            function readNotesFromLocalStorage() {
                try {
                    const parsed = JSON.parse(localStorage.getItem('win11_richtext_notes') || '[]');
                    return Array.isArray(parsed) ? parsed : [];
                } catch (error) {
                    console.warn('Could not read local notes cache:', error);
                    return [];
                }
            }

            let notes = readNotesFromLocalStorage();
            let globalTags = JSON.parse(localStorage.getItem('win11_richtext_global_tags')) || [
                'Content/Characters','Content/Dialogues','Content/Funny-Words','Content/Names','Content/Posts',
                'Content/Quirks','Content/Scenes','Content/Signature-Dialogues','Content/Topics','General/Marketing',
                'General/Editing','General/Important','General/Improvement-Corrections','General/Life-Lessions',
                'General/Music-Sources','General/Read-Later','General/Script-Writing','General/Strategy',
                'General/Things-I-Love-Doing','General/Thumbnail-Title','General/Tips'
            ];
            let activeNoteId = null;
            let selectedIds = new Set();
            let lastClickedId = null;
            let syncTimeoutId = null;
            let unsubscribeSnapshot = null;
            let lastKeyWasEnter = false;
            let savedRange = null;
            let currentFilter = 'all';

            // Persistent UI / export / naming state.
            const EXPORTED_IDS_KEY = 'win11_richtext_exported_note_ids';
            const LAST_UNTITLED_NUMBER_KEY = 'win11_richtext_last_untitled_number';
            const SIDEBAR_COLLAPSED_KEY = 'win11_richtext_sidebar_collapsed';
            const PERMANENTLY_DELETED_IDS_KEY = 'win11_richtext_permanently_deleted_note_ids';
            const NOTES_DB_NAME = 'win11_richtext_notes_db_v1';
            const NOTES_DB_STORE = 'notes_cache';
            const NOTES_DB_KEY = 'all_notes';

            function readJsonArray(key) {
                try {
                    const value = JSON.parse(localStorage.getItem(key) || '[]');
                    return Array.isArray(value) ? value : [];
                } catch {
                    return [];
                }
            }

            let exportedNoteIds = new Set(readJsonArray(EXPORTED_IDS_KEY));
            let permanentlyDeletedNoteIds = new Set(readJsonArray(PERMANENTLY_DELETED_IDS_KEY));
            let notesDbPromise = null;
            let storageReady = false;

            function openNotesDB() {
                if (!('indexedDB' in window)) return Promise.resolve(null);
                if (notesDbPromise) return notesDbPromise;

                notesDbPromise = new Promise((resolve, reject) => {
                    const request = indexedDB.open(NOTES_DB_NAME, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(NOTES_DB_STORE)) {
                            db.createObjectStore(NOTES_DB_STORE);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                }).catch(error => {
                    console.warn('IndexedDB unavailable:', error);
                    return null;
                });

                return notesDbPromise;
            }

            async function saveNotesToIndexedDB() {
                const db = await openNotesDB();
                if (!db) return;

                await new Promise((resolve, reject) => {
                    const tx = db.transaction(NOTES_DB_STORE, 'readwrite');
                    tx.objectStore(NOTES_DB_STORE).put(notes, NOTES_DB_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
                });
            }

            async function loadNotesFromIndexedDB() {
                const db = await openNotesDB();
                if (!db) return;

                const indexedNotes = await new Promise((resolve, reject) => {
                    const tx = db.transaction(NOTES_DB_STORE, 'readonly');
                    const request = tx.objectStore(NOTES_DB_STORE).get(NOTES_DB_KEY);
                    request.onsuccess = () => resolve(Array.isArray(request.result) ? request.result : []);
                    request.onerror = () => reject(request.error);
                }).catch(error => {
                    console.warn('Could not read IndexedDB note cache:', error);
                    return [];
                });

                if (!indexedNotes.length && !notes.length) return;

                const localById = new Map(notes.map(note => [note.id, note]));
                const indexedById = new Map(indexedNotes.map(note => [note.id, note]));
                const merged = new Map();

                for (const note of notes) merged.set(note.id, note);
                for (const note of indexedNotes) {
                    if (!note || !note.id || permanentlyDeletedNoteIds.has(note.id)) continue;
                    const local = localById.get(note.id);
                    const localVersion = local ? Number(local.updatedAt || local.timestamp || 0) : -1;
                    const indexedVersion = Number(note.updatedAt || note.timestamp || 0);
                    if (!local || indexedVersion > localVersion) merged.set(note.id, note);
                }

                notes = [...merged.values()].filter(note => note && note.id && !permanentlyDeletedNoteIds.has(note.id));
                mergeExportHistoryIntoNotes();

                try {
                    localStorage.setItem('win11_richtext_notes', JSON.stringify(notes));
                } catch (error) {
                    console.warn('LocalStorage note cache is full; IndexedDB remains the primary local backup.', error);
                }
            }

            function savePermanentDeleteHistory() {
                localStorage.setItem(PERMANENTLY_DELETED_IDS_KEY, JSON.stringify([...permanentlyDeletedNoteIds]));
            }

            function getNoteVersion(note) {
                return Number(note?.updatedAt || note?.timestamp || 0);
            }

            let lastUntitledNumber = Number.parseInt(
                localStorage.getItem(LAST_UNTITLED_NUMBER_KEY) || '0',
                10
            );
            if (!Number.isFinite(lastUntitledNumber) || lastUntitledNumber < 0) {
                lastUntitledNumber = 0;
            }

            // Recover the highest Untitled N value from existing notes once,
            // then keep the counter permanently increasing even if notes are deleted.
            notes.forEach(note => {
                const match = String(note.title || '').trim().match(/^Untitled (\d+)$/);
                if (match) {
                    lastUntitledNumber = Math.max(lastUntitledNumber, Number.parseInt(match[1], 10));
                }
                if (note.exported === true) {
                    exportedNoteIds.add(note.id);
                }
            });

            localStorage.setItem(LAST_UNTITLED_NUMBER_KEY, String(lastUntitledNumber));
            localStorage.setItem(EXPORTED_IDS_KEY, JSON.stringify([...exportedNoteIds]));

            function saveExportHistory() {
                localStorage.setItem(EXPORTED_IDS_KEY, JSON.stringify([...exportedNoteIds]));
            }

            function setExportedState(note, exported) {
                if (!note) return;
                note.exported = exported;
                if (exported) exportedNoteIds.add(note.id);
                else exportedNoteIds.delete(note.id);
                saveExportHistory();
            }

            function mergeExportHistoryIntoNotes() {
                notes.forEach(note => {
                    note.trashed = note.trashed === true;
                    if (exportedNoteIds.has(note.id) || note.exported === true) {
                        note.exported = true;
                        exportedNoteIds.add(note.id);
                    } else {
                        note.exported = false;
                    }
                });
                saveExportHistory();
            }

            // Remember the sidebar state across refreshes.
            if (localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === 'true') {
                sidebar.classList.add('collapsed');
            }

            function setSidebarCollapsed(collapsed) {
                sidebar.classList.toggle('collapsed', collapsed);
                localStorage.setItem(SIDEBAR_COLLAPSED_KEY, String(collapsed));
            }

            // Export Session State
            let exportDirHandle = null; 

            // ---------- Sidebar Counters ----------
            function updateSidebarCounts() {
                if (trashCountEl) {
                    const count = notes.filter(n => n.trashed === true).length;
                    trashCountEl.textContent = count ? String(count) : '';
                }
            }

            // ---------- Filter Dropdown Logic ----------
            filterMenuBtn.addEventListener('click', (e) => {
                e.preventDefault();
                filterDropdown.classList.toggle('visible');
            });

            filterOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    setCurrentFilter(opt.dataset.filter);
                });
            });

            function setCurrentFilter(filter) {
                currentFilter = filter;
                filterOptions.forEach(o => o.classList.toggle('active', o.dataset.filter === filter));
                trashFolderBtn.classList.toggle('active', filter === 'trash');

                const visibleNotes = getSortedNotes().filter(note => {
                    if (filter === 'trash') return note.trashed === true;
                    if (note.trashed === true) return false;
                    if (filter === 'exported') return note.exported === true;
                    if (filter === 'pending') return !note.exported;
                    return true;
                });

                if (!visibleNotes.some(note => note.id === activeNoteId)) {
                    activeNoteId = visibleNotes.length ? visibleNotes[0].id : null;
                    selectedIds = activeNoteId ? new Set([activeNoteId]) : new Set();
                    lastClickedId = activeNoteId;
                    if (activeNoteId) loadActiveNote();
                    else {
                        noteTitleInput.value = '';
                        noteContentEl.innerHTML = '';
                        noteTitleInput.disabled = true;
                        noteContentEl.contentEditable = 'false';
                    }
                }

                renderNotesList();
                updateSidebarCounts();
                filterDropdown.classList.remove('visible');
                updateContextMenuLabels();
                if (typeof updateActionTooltips === 'function') updateActionTooltips();
            }

            document.addEventListener('click', (e) => {
                if (filterDropdown.classList.contains('visible') && !e.target.closest('.filter-dropdown-container')) {
                    filterDropdown.classList.remove('visible');
                }
            });

            trashFolderBtn.addEventListener('click', () => setCurrentFilter(currentFilter === 'trash' ? 'all' : 'trash'));

            // ---------- Keyboard Shortcuts System ----------
            const shortcutActions = [
                { id: 'newNote', label: 'New Note', default: { ctrlOrMeta: true, alt: true, shift: false, key: 'n' } },
                { id: 'delete', label: 'Delete Note', default: { ctrlOrMeta: true, alt: false, shift: true, key: 'backspace' } },
                { id: 'export', label: 'Export Notes', default: { ctrlOrMeta: true, alt: false, shift: true, key: 'e' } },
                { id: 'toggleMenu', label: 'Toggle Sidebar', default: { ctrlOrMeta: true, alt: false, shift: false, key: '/' } },
                { id: 'bold', label: 'Bold', default: { ctrlOrMeta: true, alt: false, shift: false, key: 'b' } },
                { id: 'italic', label: 'Italic', default: { ctrlOrMeta: true, alt: false, shift: false, key: 'i' } },
                { id: 'heading2', label: 'Heading', default: { ctrlOrMeta: true, alt: false, shift: false, key: '2' } },
                { id: 'quote', label: 'Blockquote', default: { ctrlOrMeta: true, alt: false, shift: true, key: 'q' } },
                { id: 'bullet', label: 'Bulleted List', default: { ctrlOrMeta: true, alt: false, shift: true, key: 'u' } },
                { id: 'link', label: 'Insert Link', default: { ctrlOrMeta: true, alt: false, shift: false, key: 'k' } }
            ];
            let userShortcuts = JSON.parse(localStorage.getItem('win11_richtext_shortcuts')) || {};
            let recordingActionId = null;

            function getShortcut(id) {
                return userShortcuts[id] || shortcutActions.find(a => a.id === id).default;
            }

            function formatShortcut(shortcut) {
                const parts = [];
                const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                if (shortcut.ctrlOrMeta) parts.push(isMac ? 'Cmd' : 'Ctrl');
                if (shortcut.alt) parts.push(isMac ? 'Opt' : 'Alt');
                if (shortcut.shift) parts.push('Shift');
                
                let keyName = shortcut.key;
                if (keyName.toLowerCase() === 'backspace') keyName = 'Backspace';
                else keyName = keyName.toUpperCase();
                
                parts.push(keyName);
                return parts.join(' + ');
            }

            function updateTooltips() {
                document.getElementById('add-note-btn').title = `New Note (${formatShortcut(getShortcut('newNote'))})`;
                document.getElementById('delete-note-btn').title = `Delete Selected Notes (${formatShortcut(getShortcut('delete'))})`;
                document.getElementById('export-single-btn').title = `Export Selected Notes (${formatShortcut(getShortcut('export'))})`;
                document.getElementById('toggle-sidebar-btn').title = `Toggle Menu (${formatShortcut(getShortcut('toggleMenu'))})`;
                
                document.querySelector('[data-command="bold"]').title = `Bold (${formatShortcut(getShortcut('bold'))})`;
                document.querySelector('[data-command="italic"]').title = `Italic (${formatShortcut(getShortcut('italic'))})`;
                document.querySelector('[data-command="formatBlock"][data-value="H2"]').title = `Heading (${formatShortcut(getShortcut('heading2'))})`;
                document.querySelector('[data-command="formatBlock"][data-value="BLOCKQUOTE"]').title = `Quote (${formatShortcut(getShortcut('quote'))})`;
                document.querySelector('[data-command="insertUnorderedList"]').title = `Bulleted List (${formatShortcut(getShortcut('bullet'))})`;
                document.querySelector('[data-command="createLink"]').title = `Link (${formatShortcut(getShortcut('link'))})`;
            }

            function renderShortcutsModal() {

                shortcutActions.forEach(action => {

                    row.className = 'shortcut-row';

                    row.innerHTML = `

                        <button class="shortcut-btn ${isRecording ? 'recording' : ''}" data-id="${action.id}">${btnText}</button>

                    shortcutsListEl.appendChild(row);

                shortcutsListEl.querySelectorAll('.shortcut-btn').forEach(btn => {

            });

            resetShortcutsBtn.addEventListener('click', () => {
                if (confirm("Reset all shortcuts to default?")) {
                    userShortcuts = {};
                    localStorage.removeItem('win11_richtext_shortcuts');
                    recordingActionId = null;

                    updateTooltips();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (recordingActionId) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return; 
                    
                    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                        alert('Shortcuts must include a modifier key (Ctrl, Cmd, or Alt) so you can still type normally!');
                        recordingActionId = null;
                        renderShortcutsModal();
                        return;
                    }

                    userShortcuts[recordingActionId] = {
                        ctrlOrMeta: e.ctrlKey || e.metaKey,
                        alt: e.altKey,
                        shift: e.shiftKey,
                        key: e.key.toLowerCase()
                    };
                    localStorage.setItem('win11_richtext_shortcuts', JSON.stringify(userShortcuts));
                    recordingActionId = null;
                    renderShortcutsModal();
                    updateTooltips();
                    return;
                }

                if (shortcutsModal.classList.contains('visible')) return; 

                const editorFocused = document.activeElement === noteContentEl || noteContentEl.contains(document.activeElement);
                const isMod = e.ctrlKey || e.metaKey;
                if (editorFocused && isMod) {
                    const key = e.key.toLowerCase();
                    if (key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) document.execCommand('redo');
                        else document.execCommand('undo');
                        requestAnimationFrame(() => {
                            updateActiveNote();
                            updateToolbarState();
                        });
                        return;
                    }
                    if (key === 'y') {
                        e.preventDefault();
                        document.execCommand('redo');
                        requestAnimationFrame(() => {
                            updateActiveNote();
                            updateToolbarState();
                        });
                        return;
                    }
                }

                if (document.activeElement.tagName === 'INPUT' && !e.ctrlKey && !e.metaKey) return; 

                for (const action of shortcutActions) {
                    const sc = getShortcut(action.id);
                    const eventCtrlOrMeta = e.ctrlKey || e.metaKey;
                    if (eventCtrlOrMeta === sc.ctrlOrMeta && e.altKey === sc.alt && e.shiftKey === sc.shift && e.key.toLowerCase() === sc.key.toLowerCase()) {
                        e.preventDefault();
                        if (action.id === 'newNote') createNewNote();
                        else if (action.id === 'delete') deleteNoteBtn.click();
                        else if (action.id === 'export') exportSingleBtn.click();
                        else if (action.id === 'toggleMenu') setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
                        else if (action.id === 'bold') { document.execCommand('bold'); updateActiveNote(); updateToolbarState(); }
                        else if (action.id === 'italic') { document.execCommand('italic'); updateActiveNote(); updateToolbarState(); }
                        else if (action.id === 'heading2') { document.execCommand('formatBlock', false, 'H2'); updateActiveNote(); updateToolbarState(); }
                        else if (action.id === 'quote') { document.execCommand('formatBlock', false, 'BLOCKQUOTE'); updateActiveNote(); updateToolbarState(); }
                        else if (action.id === 'bullet') { document.execCommand('insertUnorderedList'); updateActiveNote(); updateToolbarState(); }
                        else if (action.id === 'link') {
                            if (linkPopup.classList.contains('visible')) hideLinkPopup();
                            else showLinkPopup();
                        }
                        return;
                    }
                }
            }, true); 

            // ---------- Editor Card Resizing Logic ----------
            const savedCardWidth = localStorage.getItem('win11_richtext_editor_width');
            if (savedCardWidth) {

            let cardResizeState = null;

            cardResizers.forEach(resizer => {
                resizer.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const isLeft = resizer.classList.contains('left-edge');
                    cardResizeState = {
                        startX: e.clientX,
                        startWidth: editorCard.getBoundingClientRect().width,
                        isLeft: isLeft
                    };
                    document.body.style.cursor = 'ew-resize';
                    resizer.classList.add('active');
                });
            });

            document.addEventListener('mousemove', (e) => {
                if (cardResizeState) {
                    const deltaX = e.clientX - cardResizeState.startX;
                    const widthChange = cardResizeState.isLeft ? -deltaX : deltaX;
                    let newWidth = cardResizeState.startWidth + (widthChange * 2);
                    
                    newWidth = Math.max(400, newWidth); 
                    newWidth = Math.min(window.innerWidth - 60, newWidth); 
                    
                    editorCard.style.maxWidth = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                if (cardResizeState) {
                    document.body.style.cursor = '';
                    cardResizers.forEach(r => r.classList.remove('active'));
                    localStorage.setItem('win11_richtext_editor_width', editorCard.getBoundingClientRect().width);
                    cardResizeState = null;
                }
            });

            // ---------- Dynamic Typewriter Centering ----------
            function enforceTypewriterScroll() {
                if (document.activeElement !== noteContentEl) return;
                
                const sel = window.getSelection();
                if (!sel.rangeCount) return;

                let caretY;
                const range = sel.getRangeAt(0);
                const rects = range.getClientRects();
                
                if (rects.length > 0) {
                    caretY = rects[0].top;
                } else {
                    const marker = document.createElement('span');
                    marker.textContent = '\u200b'; 
                    range.insertNode(marker);
                    caretY = marker.getBoundingClientRect().top;
                    marker.parentNode.removeChild(marker);
                }

                if (caretY == null) return;

                const scrollContainer = document.querySelector('.editor-body');
                const containerRect = scrollContainer.getBoundingClientRect();
                
                const threshold = containerRect.top + (containerRect.height * 0.65);
                const centerTarget = containerRect.top + (containerRect.height * 0.5);

                if (caretY > threshold) {
                    const distance = caretY - centerTarget;
                    scrollContainer.scrollBy({ top: distance, behavior: 'smooth' });
                }
            }

            noteContentEl.addEventListener('input', () => {
                updateActiveNote();
                requestAnimationFrame(enforceTypewriterScroll);
            });

            noteContentEl.addEventListener('keyup', (e) => {
                if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
                    requestAnimationFrame(enforceTypewriterScroll);
                }
            });

            function renderTagDropdown() {
                tagListUI.innerHTML = '';
                const activeNote = notes.find(n => n.id === activeNoteId);

                globalTags.forEach(tag => {

                    if (isApplied) li.classList.add('applied');
                    li.innerHTML = `
                        <span class="tag-name" style="flex:1;">${isApplied ? '✓ ' : ''}${tag}</span>
                        <button class="delete-tag-btn" title="Delete tag globally">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    `;
                    li.querySelector('.tag-name').addEventListener('click', () => {
                        if (!activeNote) return;

                        if (isApplied) activeNote.tags = activeNote.tags.filter(t => t !== tag);
                        else activeNote.tags.push(tag);
                        
                        setExportedState(activeNote, false); // Note changed
                        saveToStorage(); 
                        updateActiveNote(); 
                        renderTagDropdown(); 
                    });
                    li.querySelector('.delete-tag-btn').addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm(`Delete the tag "${tag}" from ALL notes?`)) {
                            globalTags = globalTags.filter(t => t !== tag);
                            localStorage.setItem('win11_richtext_global_tags', JSON.stringify(globalTags));
                            notes.forEach(n => {
                                if (n.tags && n.tags.includes(tag)) {
                                    n.tags = n.tags.filter(t => t !== tag);
                                    setExportedState(n, false); // Modified, so not technically the exported version
                                    debouncedCloudSave(n, 0); 
                                }
                            });
                            saveToStorage();
                            renderTagDropdown();
                        }
                    });
                    tagListUI.appendChild(li);
                });
            }

            addTagSubmit.addEventListener('click', () => {

                if (val && !globalTags.includes(val)) {

                    newTagInput.value = '';

            newTagInput.addEventListener('keydown', (e) => {

            });

            // ---------- Firebase Sync ----------
            const cloudSaveTimers = new Map();

            function clearCloudSaveTimer(noteId) {
                const timer = cloudSaveTimers.get(noteId);
                if (timer) {
                    clearTimeout(timer);
                    cloudSaveTimers.delete(noteId);
                }
            }

            function debouncedCloudSave(note, delay = 800) {
                if (!auth.currentUser || !note) return;

                clearCloudSaveTimer(note.id);
                const snapshot = JSON.parse(JSON.stringify(note));

                const timer = setTimeout(async () => {
                    cloudSaveTimers.delete(snapshot.id);
                    try {
                        const noteRef = doc(db, 'users', auth.currentUser.uid, 'notes', snapshot.id);
                        await setDoc(noteRef, snapshot);
                    } catch (error) {
                        console.error('Error saving note to cloud:', error);
                    }
                }, delay);

                cloudSaveTimers.set(note.id, timer);
            }

            async function saveNoteToCloud(note) {
                if (!auth.currentUser || !note) return;
                clearCloudSaveTimer(note.id);
                try {
                    const snapshot = JSON.parse(JSON.stringify(note));
                    await setDoc(doc(db, 'users', auth.currentUser.uid, 'notes', note.id), snapshot);
                } catch (error) {
                    console.error('Error saving note to cloud:', error);
                }
            }

            function mergeCloudNotes(cloudNotes) {
                const localById = new Map(notes.map(note => [note.id, note]));
                const cloudById = new Map(cloudNotes.map(note => [note.id, note]));
                const merged = new Map();
                const localNotesToUpload = [];

                for (const cloudNote of cloudNotes) {
                    if (!cloudNote?.id || permanentlyDeletedNoteIds.has(cloudNote.id)) continue;

                    const localNote = localById.get(cloudNote.id);
                    if (!localNote) {
                        merged.set(cloudNote.id, cloudNote);
                        continue;
                    }

                    if (getNoteVersion(localNote) > getNoteVersion(cloudNote)) {
                        merged.set(localNote.id, localNote);
                        localNotesToUpload.push(localNote);
                    } else {
                        merged.set(cloudNote.id, cloudNote);
                    }
                }

                // Never discard a local note just because the first Firebase snapshot
                // has not received it yet. Preserve it and upload it.
                for (const localNote of notes) {
                    if (!localNote?.id || permanentlyDeletedNoteIds.has(localNote.id)) continue;
                    if (!cloudById.has(localNote.id)) {
                        merged.set(localNote.id, localNote);
                        localNotesToUpload.push(localNote);
                    }
                }

                notes = [...merged.values()].sort((a, b) => getNoteVersion(b) - getNoteVersion(a));
                mergeExportHistoryIntoNotes();
                return localNotesToUpload;
            }

            function listenToCloud() {
                if (!auth.currentUser) return;
                if (unsubscribeSnapshot) unsubscribeSnapshot();

                const notesRef = collection(db, 'users', auth.currentUser.uid, 'notes');
                unsubscribeSnapshot = onSnapshot(notesRef, async (querySnapshot) => {
                    // Keep our local version untouched while our own writes are still pending.
                    if (querySnapshot.metadata.hasPendingWrites) return;

                    const cloudNotes = [];
                    querySnapshot.forEach(snapshot => cloudNotes.push(snapshot.data()));

                    const localNotesToUpload = mergeCloudNotes(cloudNotes);

                    try {
                        localStorage.setItem('win11_richtext_notes', JSON.stringify(notes));
                    } catch (error) {
                        console.warn('LocalStorage note cache is full; continuing with IndexedDB.', error);
                    }
                    saveNotesToIndexedDB().catch(error => console.warn('IndexedDB cache save failed:', error));

                    if (localNotesToUpload.length) {
                        const uniqueNotes = [...new Map(localNotesToUpload.map(note => [note.id, note])).values()];
                        await Promise.all(uniqueNotes.map(note => saveNoteToCloud(note)));
                    }

                    const liveVisibleNotes = getSortedNotes().filter(note => {
                        if (currentFilter === 'trash') return note.trashed === true;
                        return note.trashed !== true;
                    });

                    if (!liveVisibleNotes.some(note => note.id === activeNoteId)) {
                        activeNoteId = liveVisibleNotes.length ? liveVisibleNotes[0].id : null;
                        selectedIds = activeNoteId ? new Set([activeNoteId]) : new Set();
                        lastClickedId = activeNoteId;
                    }

                    renderNotesList();
                    updateSidebarCounts();

                    const activeCloudNote = notes.find(note => note.id === activeNoteId);
                    if (activeCloudNote && (
                        noteContentEl.innerHTML !== activeCloudNote.content ||
                        noteTitleInput.value !== activeCloudNote.title
                    )) {
                        loadActiveNote();
                    } else if (!activeCloudNote) {
                        loadActiveNote();
                    }
                }, error => console.error('Real-time sync error:', error));
            }

            async function deleteFromCloud(noteId) {
                clearCloudSaveTimer(noteId);
                if (!auth.currentUser) return;
                try {
                    await deleteDoc(doc(db, 'users', auth.currentUser.uid, 'notes', noteId));
                } catch (error) {
                    console.error('Error deleting from cloud:', error);
                }
            }

            // ---------- Auth ----------
            loginBtn.addEventListener('click', async () => {
                if (auth.currentUser) return; 
                
                const email = prompt("Enter Firebase Email:");
                if (!email) return;
                const password = prompt("Enter Firebase Password:");

                    } catch (error) { alert("Login failed: " + error.message); }

            logoutBtn.addEventListener('click', async () => {
                if (confirm("Are you sure you want to log out of Firebase Sync?")) {

                    } catch (error) {

                    }
                }
            });

            onAuthStateChanged(auth, (user) => {
                if (user) {

                    loginBtn.textContent = `Synced: ${displayEmail}`;
                    loginBtn.style.color = "var(--accent)";

                    // Do not start Firebase replacement/merge until local storage
                    // (including the IndexedDB backup) has finished loading.
                    if (storageReady) listenToCloud();
                } else {

                    loginBtn.style.color = "";

            // ---------- Core Note Functions ----------
            function persistLocalNotes() {
                mergeExportHistoryIntoNotes();
                try {
                    localStorage.setItem('win11_richtext_notes', JSON.stringify(notes));
                } catch (error) {
                    // Rich image data can exhaust LocalStorage. IndexedDB keeps the notes safe.
                    console.warn('LocalStorage note cache is full; using IndexedDB for persistence.', error);
                }
                saveNotesToIndexedDB().catch(error => console.warn('IndexedDB cache save failed:', error));
            }

            async function init() {
                updateTooltips();
                await loadNotesFromIndexedDB();
                mergeExportHistoryIntoNotes();
                trashFolderBtn.classList.toggle('active', currentFilter === 'trash');

                const liveNotes = getSortedNotes().filter(note => !note.trashed);
                if (liveNotes.length === 0) {
                    createNewNote();
                } else {
                    activeNoteId = liveNotes[0].id;
                    selectedIds = new Set([activeNoteId]);
                    lastClickedId = activeNoteId;
                    renderNotesList();
                    updateSidebarCounts();
                    loadActiveNote();
                }
            }

            function saveToStorage() {
                persistLocalNotes();
                renderNotesList();
                updateSidebarCounts();
                const activeNote = notes.find(n => n.id === activeNoteId);
                if (activeNote) debouncedCloudSave(activeNote);
            }

            // --- MONOTONIC SMART NEW NOTE NAMING ---
            // The counter is intentionally separate from notes so deleting
            // "Untitled 4" does not allow "Untitled 4" to be reused.
            function createNewNote() {
                let hasPlainUntitled = false;
                let highestSeenNumber = lastUntitledNumber;

                notes.forEach(n => {
                    const title = String(n.title || '').trim();
                    if (title === 'Untitled') hasPlainUntitled = true;

                    const match = title.match(/^Untitled (\d+)$/);
                    if (match) {
                        highestSeenNumber = Math.max(
                            highestSeenNumber,
                            Number.parseInt(match[1], 10)
                        );
                    }
                });

                lastUntitledNumber = highestSeenNumber;

                let newTitle;
                if (!hasPlainUntitled && lastUntitledNumber === 0) {
                    newTitle = 'Untitled';
                } else {
                    lastUntitledNumber += 1;
                    newTitle = `Untitled ${lastUntitledNumber}`;
                }

                localStorage.setItem(LAST_UNTITLED_NUMBER_KEY, String(lastUntitledNumber));

                const newNote = { 
                    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, 
                    title: newTitle, 
                    content: '', 
                    timestamp: Date.now(), 
                    updatedAt: Date.now(),
                    tags: [], 
                    exported: false
                };

                newNote.trashed = false;
                newNote.trashedAt = null;
                notes.unshift(newNote);
                activeNoteId = newNote.id;
                selectedIds = new Set([activeNoteId]);
                lastClickedId = activeNoteId;

                if (currentFilter === 'exported' || currentFilter === 'trash') {
                    setCurrentFilter('all');
                }

                saveToStorage();
                loadActiveNote();

                setTimeout(() => {
                    noteTitleInput.focus();
                    noteTitleInput.select();
                }, 50);
            }

            function loadActiveNote() {
                const activeNote = notes.find(n => n.id === activeNoteId);
                if (activeNote) {
                    noteTitleInput.value = activeNote.title;
                    noteContentEl.innerHTML = activeNote.content;
                    noteTitleInput.disabled = false;
                    noteContentEl.contentEditable = "true";
                } else {
                    noteTitleInput.value = '';
                    noteContentEl.innerHTML = '';
                    noteTitleInput.disabled = true;
                    noteContentEl.contentEditable = "false";
                }
            }

            // --- TRACKING CHANGES TO REMOVE "EXPORTED" STATUS ---
            function updateActiveNote() {
                const activeNote = notes.find(n => n.id === activeNoteId);
                if (activeNote) {
                    const hasChanged = activeNote.title !== noteTitleInput.value || activeNote.content !== noteContentEl.innerHTML;
                    
                    if (hasChanged) {
                        activeNote.title = noteTitleInput.value;
                        activeNote.content = noteContentEl.innerHTML;
                        activeNote.timestamp = Date.now();
                        activeNote.updatedAt = activeNote.timestamp;
                        setExportedState(activeNote, false); // Edited notes need re-exporting.
                    }
                    
                    saveToStorage();
                }
            }

            function getSortedNotes() {
                return [...notes].sort((a, b) => b.timestamp - a.timestamp);
            }

            function chooseNextActiveNote() {
                const available = getSortedNotes().filter(n => !n.trashed);
                activeNoteId = available.length ? available[0].id : null;
                selectedIds = activeNoteId ? new Set([activeNoteId]) : new Set();
                lastClickedId = activeNoteId;
            }

            async function moveNotesToTrash(ids) {
                const idSet = new Set(ids);
                const now = Date.now();
                notes.forEach(note => {
                    if (idSet.has(note.id)) {
                        note.trashed = true;
                        note.trashedAt = now;
                        note.timestamp = now;
                        note.updatedAt = now;
                    }
                });

                selectedIds.clear();
                if (idSet.has(activeNoteId)) {
                    chooseNextActiveNote();
                }

                saveToStorage();
                for (const id of ids) {
                    const note = notes.find(n => n.id === id);
                    if (note) await saveNoteToCloud(note);
                }

                if (activeNoteId) loadActiveNote();
                else if (currentFilter !== 'trash') createNewNote();
                else {
                    noteTitleInput.value = '';
                    noteContentEl.innerHTML = '';
                    noteTitleInput.disabled = true;
                    noteContentEl.contentEditable = 'false';
                }
            }

            async function restoreNotes(ids) {
                const idSet = new Set(ids);
                notes.forEach(note => {
                    if (idSet.has(note.id)) {
                        note.trashed = false;
                        note.trashedAt = null;
                        note.timestamp = Date.now();
                        note.updatedAt = note.timestamp;
                    }
                });

                if (idSet.has(activeNoteId) || currentFilter === 'trash') {
                    chooseNextActiveNote();
                }
                selectedIds.clear();
                if (activeNoteId) selectedIds.add(activeNoteId);

                saveToStorage();
                for (const id of ids) {
                    const note = notes.find(n => n.id === id);
                    if (note) await saveNoteToCloud(note);
                }
                if (activeNoteId) loadActiveNote();
                else {
                    noteTitleInput.value = '';
                    noteContentEl.innerHTML = '';
                    noteTitleInput.disabled = true;
                    noteContentEl.contentEditable = 'false';
                }
            }

            async function permanentlyDeleteNotes(ids) {
                ids.forEach(id => permanentlyDeletedNoteIds.add(id));
                savePermanentDeleteHistory();

                for (const id of ids) {
                    await deleteFromCloud(id);
                }

                const idSet = new Set(ids);
                notes = notes.filter(n => !idSet.has(n.id));
                ids.forEach(id => {
                    selectedIds.delete(id);

                });
                saveExportHistory();

                if (idSet.has(activeNoteId) || !notes.find(n => n.id === activeNoteId)) {
                    chooseNextActiveNote();

                saveToStorage();
                if (activeNoteId) loadActiveNote();
                else {
                    noteTitleInput.value = '';
                    noteContentEl.innerHTML = '';
                    noteTitleInput.disabled = true;
                    noteContentEl.contentEditable = 'false';
                }
